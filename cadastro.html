<!DOCTYPE html>
<html lang="PT-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Veículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <section class="vh-100 gradient-custom bg-primary-subtle">
    <div class="container py-5 h-100">
      <div class="row justify-content-center align-items-center h-100">
        <div class="col-12 col-lg-9 col-xl-7">
          <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
            <div class="card-body p-4 p-md-5">
              <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 text-center">Cadastro de Veículos</h3>
              <form>

                <div class="row">
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Modelo" class="form-control form-control-lg" />
                      <label class="form-label" for="Modelo">Modelo</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Marca" class="form-control form-control-lg" />
                      <label class="form-label" for="Marca">Marca</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Ano de fabricação" class="form-control form-control-lg" />
                      <label class="form-label" for="Ano de fabricação">Ano de fabricação</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Ano do modelo" class="form-control form-control-lg" />
                      <label class="form-label" for="Ano do modelo">Ano do modelo</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Cor" class="form-control form-control-lg" />
                      <label class="form-label" for="Cor">Cor</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Categoria" class="form-control form-control-lg" />
                      <label class="form-label" for="Categoria">Categoria</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Combustível" class="form-control form-control-lg" />
                      <label class="form-label" for="Combustível">Combustível</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Câmbio" class="form-control form-control-lg" />
                      <label class="form-label" for="Câmbio">Câmbio</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Quilometragem" class="form-control form-control-lg" />
                      <label class="form-label" for="Quilometragem">Quilometragem</label>
                    </div>

                  </div>
                  <div class="col-md-6 mb-4">

                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="Preço" class="form-control form-control-lg" />
                      <label class="form-label" for="Preço">Preço</label>
                    </div>

                  </div>
                  <div class="mb-3">
                    <label for="arquivo" class="form-label">Imagem do Veículo:</label>
                    <input class="form-control" type="file" id="arquivo" name="arquivo" accept=".pdf,.doc,.docx,image/*"
                      required>
                    <div class="invalid-feedback">
                      Por favor, envie um arquivo.
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="Descrição" class="form-label">Descrição</label>
                    <textarea class="form-control" id="Descrição" rows="3"></textarea>
                  </div>
                </div>

                <div class="mt-4 pt-2">
                  <input data-mdb-ripple-init class="btn btn-primary btn-lg" type="submit" value="Submit" />
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
